name: aether-personal-sandbox

services:
  server:
    image: aether-personal-sandbox-server:dev
    build:
      context: .
      dockerfile: Dockerfile.server
    network_mode: bridge
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-18090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - server-data:/root/.opensandbox
    configs:
      - source: server-config
        target: /etc/opensandbox/config.toml

configs:
  server-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090
      api_key = "${SANDBOX_API_KEY:?Set SANDBOX_API_KEY in infra/sandbox/.env}"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      publish_host = "127.0.0.1"
      port_range_min = 41000
      port_range_max = 43000
      no_new_privileges = true
      pids_limit = 4096

      [proxy]
      resolve_internal = true

      [ingress]
      mode = "direct"

volumes:
  server-data:
