# 本文件提供本地开发的 PostgreSQL 与纯内存 Redis 容器，供 backend/Makefile 启动并等待健康。
name: aether-personal-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aether", "-d", "aether"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
