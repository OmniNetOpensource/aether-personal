name: aether-personal-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aether", "-d", "aether"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
