# 本工作流在 main push 后串行发布，数据库备份只保留在生产主机。
name: Deploy production
run-name: Deploy ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 发布不能因后续 push 被取消，避免中断数据库迁移或留下前后端版本不一致。
concurrency:
  group: aether-personal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://aether.forkicks.fun
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.32.1'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            admin/pnpm-lock.yaml
            infra/cloudflare/pnpm-lock.yaml

      # 独立 BuildKit builder 可导出中间构建层，临时 runner 从前一次提交恢复缓存。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Restore Docker build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/aether-build-cache
          key: production-buildkit-${{ runner.os }}-amd64-v1-${{ github.sha }}
          restore-keys: production-buildkit-${{ runner.os }}-amd64-v1-

      - name: Install image compression
        run: sudo apt-get update && sudo apt-get install -y pigz

      # 凭证只写入 runner 的私有目录；主机公钥来自已核对的 Secrets，不现场信任 keyscan。
      - name: Configure deployment access
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          required = ('SSH_HOST', 'SSH_USER', 'SSH_PRIVATE_KEY', 'SSH_KNOWN_HOSTS',
                      'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing deployment configuration: ' + ', '.join(missing))
          host, user = os.environ['SSH_HOST'], os.environ['SSH_USER']
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9.-]*', host) or not re.fullmatch(r'[a-z_][a-z0-9_-]*', user):
              raise SystemExit('Invalid deployment SSH host or user')
          root = Path('.local').resolve()
          root.mkdir(mode=0o700, exist_ok=True)
          (root / 'ci-key').write_text(os.environ['SSH_PRIVATE_KEY'].rstrip() + '\n')
          (root / 'ci-known-hosts').write_text(os.environ['SSH_KNOWN_HOSTS'].rstrip() + '\n')
          (root / 'ci.ssh').write_text(
              f'Host aether-prod\n  HostName {host}\n  User {user}\n'
              f'  IdentityFile "{root}/ci-key"\n  IdentitiesOnly yes\n'
              f'  UserKnownHostsFile "{root}/ci-known-hosts"\n')
          (root / 'publish.json').write_text(json.dumps({
              'ssh_host': 'aether-prod', 'ssh_config': '.local/ci.ssh',
              'public_url': 'https://aether.forkicks.fun',
          }) + '\n')
          PY
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISH_BUILD_CACHE: ${{ runner.temp }}/aether-build-cache
        run: python3 scripts/publish.py --ci

      - name: Remove runner credentials
        if: ${{ always() }}
        run: |
          rm -f .local/ci-key .local/ci-known-hosts .local/ci.ssh .local/publish.json
